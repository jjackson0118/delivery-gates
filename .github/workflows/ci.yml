# Lints the gate scripts. A gate with a shell bug cannot be trusted to fail
# correctly.
#
# This calls gates/shellcheck.sh rather than running shellcheck inline. It used
# to be an inline apt-get-and-run step, which made it the one check in this
# repository that could not be run locally, could not be run by Jenkins, and
# could not be exercised by prove-gates-fail. The check watching every other
# script was the only one with no proof that it fires.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gate -- shellcheck
        run: ./ci/run-gate.sh ./gates/shellcheck.sh .

      - name: Gate -- docs
        run: ./ci/run-gate.sh ./gates/docs.sh .

      # The adapter is the only place orchestrator knowledge lives, so it needs
      # its own assertion. Exit 3 mapping to 0 is the case that is easy to get
      # wrong and impossible to notice: it only bites a consumer that has no
      # shell files, which this repository will never be.
      # Runs with an isolated GATE_REPORT_DIR. The first version of this step
      # cleaned up with `rm -rf .gate-reports` and destroyed the report the
      # gate step above had just written, so the upload found nothing. A test
      # that damages the thing it runs beside is not isolated, and the only
      # reason it surfaced is if-no-files-found: error on the upload.
      - name: Assert the adapter maps the contract correctly
        env:
          GATE_REPORT_DIR: ${{ runner.temp }}/adapter-selftest-reports
        run: |
          set -u
          # No -e. This step deliberately runs commands that exit non-zero and
          # reads their status; under -e the shell aborts before the status can
          # be captured, and the assertion silently checks nothing.
          set +e
          scratch=$(mktemp -d)
          # The probe writes a report, because a real gate does. The adapter
          # now refuses to trust a 0/1/3 exit with no report behind it, and the
          # first version of this probe did not write one -- so the assertion
          # failed on the runner while passing locally against a probe I had
          # already updated. The test and the thing it tests have to be the
          # same test.
          probe() {
            cat > "$scratch/g.sh" <<PROBE
          #!/bin/sh
          mkdir -p "\$GATE_REPORT_DIR"
          printf '{"gate":"g","status":"probe","exit_code":$1}' > "\$GATE_REPORT_DIR/g.json"
          exit $1
          PROBE
            sed -i 's/^          //' "$scratch/g.sh"
            chmod +x "$scratch/g.sh"
            ./ci/run-gate.sh "$scratch/g.sh" >/dev/null 2>&1
            echo $?
          }
          fail=0
          for pair in "0 0" "1 1" "2 1" "3 0" "7 1"; do
            set -- $pair
            got=$(probe "$1")
            if [ "$got" != "$2" ]; then echo "gate exit $1 -> adapter $got, expected $2"; fail=1
            else echo "ok: gate exit $1 -> adapter $2"; fi
          done
          # A gate claiming success with no report behind it is a gate that
          # did not complete. Asserted here because the adapter is the only
          # thing that checks it.
          printf '#!/bin/sh\nexit 0\n' > "$scratch/noreport.sh"
          chmod +x "$scratch/noreport.sh"
          rm -f "$GATE_REPORT_DIR/noreport.json"
          ./ci/run-gate.sh "$scratch/noreport.sh" >/dev/null 2>&1
          if [ "$?" = "1" ]; then
            echo "ok: exit 0 with no report -> adapter 1"
          else
            echo "FAIL: exit 0 with no report was trusted"; fail=1
          fi

          # Regression: a relative GATE_REPORT_DIR against a foreign target.
          # This resolved the report path against the target rather than the
          # caller, the write failed, and the gate exited 1 with no report --
          # "found what it looks for" from a gate that found nothing.
          # Regression: a relative GATE_REPORT_DIR against a foreign target.
          # This resolved the report path against the target rather than the
          # caller, the write failed, and the gate exited 1 with no report --
          # "found what it looks for" from a gate that found nothing.
          # Run in a scratch cwd so the repository's own reports are untouched.
          foreign=$(mktemp -d); : > "$foreign/only.java"
          here=$(pwd); scratchcwd=$(mktemp -d)
          ( cd "$scratchcwd" && GATE_REPORT_DIR=.gate-reports \
              "$here/ci/run-gate.sh" "$here/gates/shellcheck.sh" "$foreign" >/dev/null 2>&1 )
          rc=$?
          if [ "$rc" = "0" ] && [ -f "$scratchcwd/.gate-reports/shellcheck.json" ]; then
            echo "ok: relative report dir + foreign target -> exit 0, report written to caller"
          else
            echo "FAIL: exit $rc, report present: $([ -f "$scratchcwd/.gate-reports/shellcheck.json" ] && echo yes || echo no)"
            fail=1
          fi

          exit $fail
      - name: Publish gate report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-reports-shellcheck
          path: .gate-reports/
          include-hidden-files: true
          if-no-files-found: error
