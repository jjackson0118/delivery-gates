# The paved road.
#
# Consumer repositories call this instead of writing their own gate steps, so a
# gate improvement reaches every consumer through a version bump rather than
# through N copy-pasted edits. That is the difference between a platform team
# and a team that wrote a pipeline once.
#
# Every gate here is gates/<name>.sh in this repository. This workflow provides
# a runner, a checkout and an artifact upload; it does not implement a single
# check. If a gate were expressed in this YAML it could not be run by Jenkins,
# could not be run locally, and could not be exercised by prove-gates-fail --
# which would prove a copy rather than the gate.
name: jvm-pipeline

on:
  workflow_call:
    inputs:
      java-version:
        description: JDK to build against
        type: string
        default: "21"
      gates-ref:
        description: >-
          Ref of delivery-gates to run. Pin to a tag in production so a change
          to the gates cannot alter a consumer's verdict without a deliberate
          version bump.
        type: string
        default: main

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the consumer repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history. A shallow clone gives the secret gate a single merge
          # commit to look at, which it would scan, pass, and report as
          # coverage. The gate declares its commit count so a truncated range
          # shows up as a number rather than as silence -- but not fetching the
          # history in the first place is the cheaper fix.
          fetch-depth: 0

      - name: Check out the gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jjackson0118/delivery-gates
          ref: ${{ inputs.gates-ref }}
          path: .delivery-gates

      - name: Set up JDK ${{ inputs.java-version }}
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}

      # Runs Gradle wrapper validation itself. The standalone gate below is not
      # redundant with it: an implicit control is not an auditable one, and the
      # gate also covers gradlew/gradlew.bat and distributionSha256Sum, which
      # this action does not.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Gate -- gradle wrapper integrity
        run: .delivery-gates/gates/gradle-wrapper.sh .

      - name: Gate -- secrets
        env:
          GATE_SECRETS_MODE: diff
          GATE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: .delivery-gates/gates/secrets.sh .

      - name: Gate -- jvm tests
        run: .delivery-gates/gates/jvm-test.sh .

      # Consumers get shell linting of their own scripts for free. The gate
      # errors rather than passes if a repository has no shell files, so a
      # consumer that has none will surface that rather than report coverage
      # it does not have.
      - name: Gate -- shellcheck
        continue-on-error: true
        run: .delivery-gates/gates/shellcheck.sh .

      # Reports are the interface. A caller that greps logs for "failed" is
      # making the same mistake as a caller that trusts an exit code alone.
      #
      # include-hidden-files is required and is not obvious: upload-artifact
      # ignores anything under a dot-directory by default, so .gate-reports/
      # uploads as nothing. if-no-files-found: error is what surfaced that --
      # on the default of 'warn' this step would have gone green while
      # publishing an empty artifact, which is the same failure this whole
      # repository is about, one level up from the gates.
      - name: Publish gate reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gate-reports
          path: .gate-reports/
          include-hidden-files: true
          if-no-files-found: error

      # The vacuity rule applies to this step too. Iterating a glob that
      # matches nothing prints an empty table and exits 0 -- a summary that
      # reports on no gates, rendered as a clean result.
      - name: Summarise
        if: always()
        run: |
          count=$(find .gate-reports -name '*.json' 2>/dev/null | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "no gate reports were produced -- the gates did not run" >&2
            exit 1
          fi
          {
            echo "## Gate reports"
            echo
            echo "| gate | status | findings | scanned |"
            echo "|---|---|---|---|"
            for f in .gate-reports/*.json; do
              jq -r '"| \(.gate) | \(.status) | \(.findings) | \(.scanned) \(.scanned_unit) |"' "$f"
            done
            echo
            echo "_${count} gate(s) reported._"
          } >> "$GITHUB_STEP_SUMMARY"
