# Proves every gate fires on the fault it exists to catch, and stays quiet on
# clean input.
#
# Separate from the pull-request pipeline on purpose. This workflow deliberately
# generates credential-shaped strings and failing builds; running it on every
# pull request would fill the Security tab with self-inflicted findings, add
# minutes to every review, and eventually get switched off.
#
# It IS required on changes to gates/ and faults/. A proof is only valid for the
# version of the gates it ran against, so a gate cannot be changed without
# re-proving it.
name: prove-gates

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  pull_request:
    paths: &gate_paths
      - "gates/**"
      - "lib/**"
      - "faults/**"
      - "prove-gates-fail.sh"
      - ".github/workflows/prove-gates.yml"
  # Also on push to main. Without this, a gate reaching main outside a pull
  # request stays unproven until the next scheduled run -- and the proof is
  # only valid for the version of the gates it ran against.
  push:
    branches: [main]
    paths: *gate_paths

permissions:
  contents: read

jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      # Both fixtures are checked out as SIBLINGS, and that is the point of the
      # path: on this step.
      #
      # This repository used to be checked out at the workspace root with
      # dora-loop nested inside it at path: dora-loop, so one fixture contained
      # the other. The harness guards duplicate paths and duplicate basenames --
      # both satisfied here -- but the property that causes the damage is
      # containment. Measured on a nested tree, gates run directly against the
      # workspace reported 33 documented claims and 31 shell files against a
      # true 28 and 30: this repository's own denominators inflated by exactly
      # dora-loop's file counts, and inflation is invisible because floors are
      # minimums.
      - name: Check out the gates
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: delivery-gates
          # Full history. This repository is now a fixture for its own gates,
          # and the default shallow clone gave the secret scanner exactly one
          # commit -- caught on the runner by the declared floor, as
          # "scanned 1, floor is 15". The vacuity rule could not catch it,
          # because 1 is not 0. That is the whole reason a floor exists.
          fetch-depth: 0

      # A real consumer, used as the fixture. Proving the gates against a toy
      # tree would prove they work on a toy tree.
      - name: Check out a consumer as the fixture
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jjackson0118/dora-loop
          # Named for the repository, not "fixture": the harness resolves a
          # fixture's declared denominators from the directory name, and a
          # generic path silently resolved to fixtures/fixture.floors.
          path: dora-loop
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Record the gate version being proven
        working-directory: delivery-gates
        run: |
          echo "Proving gates at $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Prove
        # Two fixtures. This repository is one of them: the docs gate's
        # structural sections need a gates/ directory to execute at all, so
        # against dora-loop alone they were dead code in every proof. A
        # coverage analysis deleted all four
        # sections and the corpus stayed green.
        working-directory: delivery-gates
        run: ./prove-gates-fail.sh ../dora-loop .
